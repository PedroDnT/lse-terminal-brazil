[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lse-terminal-brazil"
version = "0.1.0"
description = "Brazilian market data for LSE Terminal: B3's own public files and the Banco Central's open series API. No account, no vendor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Pedro Toledo" }]
keywords = ["b3", "bovespa", "brazil", "bacen", "market-data", "lse-terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Portuguese (Brazilian)",
]
# NOTE the absence of lse-terminal here, which is deliberate and worth
# explaining, because a plugin normally does depend on its host.
#
# The `lse-terminal` distribution on PyPI is a PLACEHOLDER: London
# Strategic Edge reserved the name with a 0.0.1 release whose wheel
# contains nothing but an empty `lse_terminal/__init__.py`. Declaring a
# dependency on it is worse than declaring none, because pip then reports
# the requirement satisfied by a package that cannot host a plugin, and
# the failure surfaces later as a bare ModuleNotFoundError on
# `lse_terminal.contracts`.
#
# So the host is a documented prerequisite rather than a resolvable
# dependency: install the terminal from its source repository, and
# __init__.py says exactly that if it is missing. Revisit this the day a
# real lse-terminal release lands on PyPI.
dependencies = [
    "pandas>=1.5",
    "numpy>=1.24",
    # COTAHIST caches are written as parquet; a yearly file is millions of
    # rows and re-parsing the fixed-width text on every chart is the thing
    # the cache exists to avoid.
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# This is the whole install story. The terminal's registry walks this group
# at start (see lse_terminal/engine/registry.py: load_plugins), instantiates
# what it finds, and the sources appear in MARKETS. Nothing else to wire.
[project.entry-points."lse_terminal.providers"]
b3 = "lse_terminal_brazil:B3Provider"
bcb = "lse_terminal_brazil:BcbProvider"

[project.urls]
Homepage = "https://github.com/PedroDnT/lse-terminal-brazil"
Issues = "https://github.com/PedroDnT/lse-terminal-brazil/issues"

[tool.hatch.build.targets.wheel]
packages = ["lse_terminal_brazil"]

[tool.hatch.build.targets.sdist]
include = ["lse_terminal_brazil", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
# The live tests talk to B3 and the Banco Central over the network, so they
# are opt-in: `pytest` runs the offline suite, `pytest -m live` asks the
# real sources. Nobody's unit run should fail because a Brazilian public
# website is having an afternoon.
addopts = "-m 'not live'"
markers = [
    "live: hits the real B3 / BCB endpoints over the network (opt-in)",
]
